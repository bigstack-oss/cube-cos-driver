# CubeCOS release -> allowed App-Framework app versions. Versions are MAJOR.MINOR.PATCH (build tag ignored).
# status: supported | untested | deprecated | blocked  (deprecated/blocked need reason)
# upgrade-hop releases (3.1.0 -> 3.2.0): never installed fresh, so no manifest
intermediate: ["3.1.10", "3.1.20"]
releases:
  "3.2.0":
    cmp:
      - { version: "2.1.1", status: supported }
    advisor:
      - { version: "0.4.29", status: supported }
      - { version: "0.4.28", status: deprecated, reason: "bundled agent lacks the console relay to agentless nodes; fixed in 0.4.29" }
      - { version: "0.4.27", status: deprecated, reason: "bundled agent lacks peer scan reads and the multi-peer enrolment fix; fixed in 0.4.28" }
      - { version: "0.4.26", status: deprecated, reason: "upgrading from an older agent sends tools the 0.4.26 agent no longer serves; fixed in 0.4.27" }
      - { version: "0.4.25", status: deprecated, reason: "bundled agent has no read brokers; ADR 0019" }
