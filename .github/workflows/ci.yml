name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Web typecheck
        run: pnpm -C web tsc

      - name: Web tests
        run: pnpm -C web test

      - name: Go vet + tests
        run: make test

      - name: End-to-end smoke (builds SPA + both binaries)
        run: bash scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            bin/cube-cos-driver
            bin/phone-home-agent
