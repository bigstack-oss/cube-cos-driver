name: CD - lab deploy

on:
  workflow_run:
    workflows: ["CD - OCI image"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

concurrency: lab-deploy

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, lab-snapshot]
    permissions:
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}:develop
    steps:
      - name: Login to ghcr (package is private)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Record current image for rollback
        run: |
          docker inspect -f '{{.Image}}' cube-cos-driver > /tmp/cd-prev-image 2>/dev/null || true

      # The image dropdown reads/flips the shared PXE grub.cfg on the NAS.
      # Mount it as a docker NFS volume so the container owns it directly — no
      # host mount or sudo needed on the runner.
      - name: Ensure PXE root volume
        run: |
          docker volume inspect pxe-root >/dev/null 2>&1 || \
            docker volume create --driver local \
              --opt type=nfs --opt o=addr=10.32.0.200,nolock,rw,vers=4.1 \
              --opt device=:/volume1/pxe-server pxe-root

      - name: Replace container
        run: |
          docker rm -f cube-cos-driver 2>/dev/null || true
          docker run -d --name cube-cos-driver --restart unless-stopped \
            -e ADVERTISE=10.32.0.202:80 -e PXE_ROOT=/pxe \
            -p 80:3001 -v /mnt/cube-cos-driver:/var/lib/cube-cos-driver \
            -v pxe-root:/pxe "$IMAGE"

      - name: Health gate (roll back on failure)
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:80/ && exit 0
            sleep 2
          done
          echo "::error::new container unhealthy — rolling back"
          docker logs cube-cos-driver | tail -50
          docker rm -f cube-cos-driver
          prev=$(cat /tmp/cd-prev-image)
          [ -n "$prev" ] && docker run -d --name cube-cos-driver --restart unless-stopped \
            -e ADVERTISE=10.32.0.202:80 -e PXE_ROOT=/pxe \
            -p 80:3001 -v /mnt/cube-cos-driver:/var/lib/cube-cos-driver \
            -v pxe-root:/pxe "$prev"
          exit 1

      - name: Prune old images
        run: docker image prune -f
