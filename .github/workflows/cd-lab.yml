name: CD - lab deploy

on:
  workflow_run:
    workflows: ["CD - OCI image"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

concurrency: lab-deploy

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # One image, one deploy recipe, per lab. Each target is a self-hosted runner
    # on the box that owns that lab's PXE tree, and advertises the address the
    # nodes booting in that lab can reach.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: lab-snapshot
            advertise: 10.32.0.202:80
            port: 80
            # The image dropdown reads/flips the shared PXE grub.cfg on the NAS.
            # Mount it as a docker NFS volume so the container owns it directly —
            # no host mount or sudo needed on the runner.
            pxe_volume: pxe-root
            pxe_nfs_addr: 10.32.0.200
            pxe_nfs_device: :/volume1/pxe-server
            data_dir: /mnt/cube-cos-driver
          - runner: lab-bigpxe
            advertise: 172.16.21.126:3001
            port: 3001
            # bigpxe serves its own PXE tree (tftpd + nginx on /home/bigstack/pxe),
            # so the grub.cfg is a local bind mount, not an NFS volume.
            pxe_volume: /home/bigstack/pxe
            data_dir: /var/lib/cube-cos-driver
    name: deploy (${{ matrix.runner }})
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    permissions:
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}:develop
    steps:
      - name: Login to ghcr (package is private)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Record current image for rollback
        run: |
          docker inspect -f '{{.Image}}' cube-cos-driver > /tmp/cd-prev-image 2>/dev/null || true

      - name: Ensure PXE root volume
        if: matrix.pxe_nfs_addr != ''
        run: |
          docker volume inspect "${{ matrix.pxe_volume }}" >/dev/null 2>&1 || \
            docker volume create --driver local \
              --opt type=nfs --opt o=addr=${{ matrix.pxe_nfs_addr }},nolock,rw,vers=4.1 \
              --opt device=${{ matrix.pxe_nfs_device }} "${{ matrix.pxe_volume }}"

      - name: Replace container
        run: |
          docker rm -f cube-cos-driver 2>/dev/null || true
          docker run -d --name cube-cos-driver --restart unless-stopped \
            -e ADVERTISE=${{ matrix.advertise }} -e PXE_ROOT=/pxe \
            -p ${{ matrix.port }}:3001 \
            -v ${{ matrix.data_dir }}:/var/lib/cube-cos-driver \
            -v ${{ matrix.pxe_volume }}:/pxe "$IMAGE"

      - name: Health gate (roll back on failure)
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:${{ matrix.port }}/ && exit 0
            sleep 2
          done
          echo "::error::new container unhealthy — rolling back"
          docker logs cube-cos-driver | tail -50
          docker rm -f cube-cos-driver
          prev=$(cat /tmp/cd-prev-image)
          [ -n "$prev" ] && docker run -d --name cube-cos-driver --restart unless-stopped \
            -e ADVERTISE=${{ matrix.advertise }} -e PXE_ROOT=/pxe \
            -p ${{ matrix.port }}:3001 \
            -v ${{ matrix.data_dir }}:/var/lib/cube-cos-driver \
            -v ${{ matrix.pxe_volume }}:/pxe "$prev"
          exit 1

      - name: Prune old images
        run: docker image prune -f
