name: CD - OCI image

on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write # dispatch cd-lab (workflow_dispatch is exempt from the GITHUB_TOKEN trigger guard)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # full history + tags so `git describe` yields a real version

      - name: Compute version
        id: ver
        run: echo "v=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.v }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Chain the lab deploy explicitly. cd-lab used to fire on this workflow's
      # workflow_run completion, but a run started by GITHUB_TOKEN (the done-label
      # ff-merge dispatches cd-oci with GITHUB_TOKEN) emits no downstream
      # workflow_run — so the lab never redeployed after an ff-merge. A
      # workflow_dispatch is exempt from that guard, so dispatch cd-lab here.
      - name: Dispatch lab deploy
        if: github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run cd-lab.yml --repo ${{ github.repository }} --ref develop
